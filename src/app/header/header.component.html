<div id="header" #headerRef class="d-flex flex-row header justify-content-between align-items-center">
    <div class="d-flex flex-row align-items-center cursor-pointer" [routerLink]="['/']">
        <!-- <video class="logo" autoplay muted loop src="../../assets/images/logo_v.mp4"></video>
          -->
        <img class="logo" src="../../assets/images/hand_logo.png">
        <h3 class="brand-name">EarnProjects</h3>
    </div>

    <div *ngIf="isLaptop" [ngClass]="{ 'desktop-menu': isLaptop, 'mobile-menu': !isLaptop }">
        <div class="d-flex flex-row justify-content-between" id="menu">
            <div class="d-flex flex-column cursor-pointer menu-item" (click)="applyClasses('ourPlan')">
                <span class="head-heading">Our Plans</span>
                <span class="line"></span>
            </div>

            <div class="d-flex flex-column cursor-pointer menu-item" (click)="applyClasses('renewPlan')">
                <span class="head-heading">Renew Your Plan</span>
                <span class="line"></span>
            </div>

            <div class="d-flex flex-column cursor-pointer menu-item" (click)="applyClasses('support')">
                <span class="head-heading">Support</span>
                <span class="line"></span>
            </div>
        </div>

        <div class="header-btns d-flex flex-row justify-content-between align-items-center ms-4">
            <span class="expert-btn cursor-pointer">
                <img class="talk-expert" src="../../assets/svg/expert.svg" />Talk To Expert
            </span>
            <button class="head-btn" *ngIf="!isLoggedIn" (click)="routeToSignup()">Get Started</button>
            <!-- <button class="head-btn" (click)="routeToSignup()"></button> -->
            <img class="profile" *ngIf="isLoggedIn" src="../../assets//svg/profile.svg" (click)="openProfile()">
        </div>

    </div>
    <div *ngIf="!isLaptop" class="d-flex">
        <!-- Hamburger Button (mobile only) -->
        <button class="btn-logout" (click)="logout()" *ngIf="isLoggedIn">
            <img src="../../assets/svg/logout.svg">
        </button>
         <button class="btn-logout" (click)="routeToSignup()" *ngIf="!isLoggedIn">
            <img src="../../assets/svg/logout.svg">
        </button>
        <button class=" d-flex btn-outline align-items-center" type="button" data-bs-toggle="offcanvas"
            data-bs-target="#mobileOffcanvas" aria-controls="mobileOffcanvas">
            <img class="hamburger" src="../../assets/svg/hamburger.svg" alt="Menu" />
        </button>

    </div>
</div>

<!-- ✅ Dropdown Only If show is true -->
<div class="drop-divs" #dropdownRef [ngClass]="{
    'divs-pos-our-plan': this.currentDrop === 'ourPlan',
    'divs-pos-review-plan': this.currentDrop === 'renewPlan',
    'divs-pos-support-plan': this.currentDrop === 'support'
  }" *ngIf="show">
    <div class="drops" *ngFor="let plan of dropDownValues" (click)="performAction(this.currentDrop,plan.Planname)">
        <img [src]="plan.src">
        <div>{{ plan.Planname }}</div>

    </div>
</div>
<div class="profile-div" *ngIf="this.showProfile">
    <div class="profile-div-btns bd-btm"><img src="../../assets/svg/cart.svg" class="logout"><span>My Plan</span></div>
    <div class="profile-div-btns" (click)="logout()"><img src="../../assets/svg/logout.svg"
            class="logout"><span>Logout</span></div>
</div>



<!-- Right side Offcanvas -->
<div class="offcanvas offcanvas-end" #offcanvasRef tabindex="-1" id="mobileOffcanvas"
    aria-labelledby="mobileOffcanvasLabel">
    <div class="offcanvas-header">
        <h5 id="mobileOffcanvasLabel ">Menu</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"
            (click)="clearData()"></button>
    </div>
    <div class="offcanvas-body">
        <!-- Yahan apna mobile menu ya plans dal sakta hai -->
        <div (click)="applyClasses('ourPlan')" class="plan-head"> Our Plans</div>
        <div *ngIf="activeDropdown === 'ourPlan'" class="plan-head-div">
            <div  *ngFor="let plan of dropDownValues" class="drops1"  (click)="performAction('ourPlan', plan.Planname)">
                <img [src]="plan.src" class="">
                <span class="list-group-item" class="plan-spans"
                   >
                    {{ plan.Planname }}
                </span>
            </div>
        </div>
        <div (click)="applyClasses('support')" class="plan-head">Support</div>
        <div *ngIf="activeDropdown === 'support'" class="plan-head-div">
            <div  *ngFor="let plan of dropDownValues" class="drops1" (click)="performAction('support', plan.Planname)">
                <img [src]="plan.src" class="">
                <span class="list-group-item" class="plan-spans"
                    >
                    {{ plan.Planname }}
                </span>
            </div>

        </div>

        <div (click)="applyClasses('renewPlan')" class="plan-head">Renew Plan</div>

        <button class="talk-expert1"> <img src="../../assets/svg/expert.svg"><span>Talk To Expert</span></button>


    </div>
</div>
